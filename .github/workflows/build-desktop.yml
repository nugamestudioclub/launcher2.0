name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_DIR: game_studio_launcher/game_studio_launcher
  FLUTTER_VERSION: '3.35.4'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos

    defaults:
      run:
        working-directory: game_studio_launcher/game_studio_launcher

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Install dependencies
        run: flutter pub get

      #- name: Verify formatting
      #  run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release

      - name: Package Windows build
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { $src = "build/windows/runner/Release" }
          Compress-Archive -Path "$src/*" -DestinationPath "$env:RUNNER_TEMP/game_studio_launcher-windows.zip"

      - name: Package macOS build
        if: matrix.target == 'macos'
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Packaging $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/game_studio_launcher-macos.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game_studio_launcher-${{ matrix.target }}
          path: ${{ runner.temp }}/game_studio_launcher-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14